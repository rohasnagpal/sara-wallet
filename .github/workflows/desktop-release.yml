name: Desktop release builds

on:
  # Triggers when a GitHub Release is published, not on a tag-name pattern —
  # this repo's releases use "alpha-N" (see ROADMAP.md/SECURITY.md context),
  # not "vX.Y.Z", so matching a specific tag pattern would silently never
  # fire. Cut the release first (as usual), then this attaches builds to it.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset_name: macos
          - os: windows-latest
            asset_name: windows
          - os: ubuntu-latest
            asset_name: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies + PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-lock.txt pyinstaller

      - name: Build with PyInstaller (onedir)
        run: pyinstaller sara-wallet.spec

      - name: Package build output (Unix)
        if: runner.os != 'Windows'
        run: |
          cd dist
          zip -r "sara-wallet-${{ matrix.asset_name }}.zip" sara-wallet

      - name: Package build output (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/sara-wallet -DestinationPath "sara-wallet-${{ matrix.asset_name }}.zip"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sara-wallet-${{ matrix.asset_name }}
          path: sara-wallet-${{ matrix.asset_name }}.zip
          if-no-files-found: error

  # Only runs when triggered by an actual published Release, not
  # workflow_dispatch — so a manual run (e.g. to shake out a fresh
  # hidden-import failure) never touches the Releases page, only produces
  # downloadable workflow artifacts. See sara-wallet.spec's own comments
  # on iterating hidden imports/metadata from real build failures.
  publish:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Attach builds to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" artifacts/*/*.zip --clobber --repo "${{ github.repository }}"
